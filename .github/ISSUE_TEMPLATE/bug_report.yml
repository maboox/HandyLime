name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes: {label: 'HandyLime and Windows versions'}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 'Steps to reproduce', description: 'Include file format, selected tool, settings and expected/actual result. Please do not upload private documents.'}
    validations: {required: true}
  - type: textarea
    id: error
    attributes: {label: 'Error from Activity', description: 'Remove personal paths or private information before posting.'}
