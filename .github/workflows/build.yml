name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version to Releases (run from the default branch)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan Git history with secrets redacted
        run: gitleaks git . --log-opts="--all" --redact --ignore-gitleaks-allow --no-banner

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $tag = 'v' + $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag must match Directory.Build.props: $tag" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install integration-test engines
        shell: pwsh
        run: |
          choco install ffmpeg libreoffice-fresh pandoc -y --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Engine installation failed' }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path.Split(';') | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore locked dependencies
        run: dotnet restore HandyLime.slnx --locked-mode --configfile NuGet.Config
      - name: Build
        run: dotnet build HandyLime.slnx -c Release --no-restore -warnaserror
      - name: Unit and real conversion integration tests
        run: dotnet run --project tests/HandyLime.Tests -c Release --no-build -- --require-engines
      - name: Package Windows x64 Portable and Lite editions
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Verify extracted release packages
        shell: pwsh
        run: ./scripts/Test-Packages.ps1
      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HandyLime-windows-x64
          path: |
            artifacts/HandyLime-windows-x64.zip
            artifacts/HandyLime-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Lite app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HandyLime-windows-x64-lite
          path: |
            artifacts/HandyLime-windows-x64-lite.zip
            artifacts/HandyLime-windows-x64-lite.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload library source companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HandyLime-corresponding-source
          path: |
            artifacts/HandyLime-corresponding-source.zip
            artifacts/HandyLime-corresponding-source.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  verify-artifacts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packages using the release download action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: HandyLime-*
          path: downloaded
          merge-multiple: true
      - name: Verify all package checksums after download
        shell: bash
        working-directory: downloaded
        run: |
          set -euo pipefail
          for name in HandyLime-windows-x64 HandyLime-windows-x64-lite HandyLime-corresponding-source; do
            test -s "$name.zip"
            test -s "$name.zip.sha256"
            sha256sum --check --strict "$name.zip.sha256"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref_name == github.event.repository.default_branch)
    needs: [build, secret-scan, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HandyLime-windows-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HandyLime-windows-x64-lite
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HandyLime-corresponding-source
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cat docs/RELEASE-NOTES.md > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Download

          - **HandyLime-windows-x64.zip** — Portable. Includes .NET; extract and run. Recommended for most users.
          - **HandyLime-windows-x64-lite.zip** — Smaller download with the same features. Requires [Microsoft .NET Desktop Runtime 10, Windows x64](https://dotnet.microsoft.com/en-us/download/dotnet/10.0).
          - **HandyLime-corresponding-source.zip** — Library source companion for redistribution/development. Not needed to run the app.
          - **.sha256** files — Optional download integrity checks.

          Extract the entire chosen app ZIP and run `HandyLime.exe`. Video/audio and Office tools use optional engines configured in Settings.

          This is a preview release. See the [user guide](https://github.com/maboox/HandyLime#readme) for usage and supported formats.

          ## دانلود

          نسخهٔ **Portable** بدون نصب جداگانهٔ دات‌نت اجرا می‌شود. نسخهٔ **Lite** کم‌حجم‌تر است و به **.NET Desktop Runtime 10 x64** نیاز دارد. فقط یکی از این دو را دانلود کنید. فایل **corresponding-source** برای اجرای برنامه لازم نیست.
          NOTES
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "HandyLime $TAG" --notes-file release-notes.md --latest
