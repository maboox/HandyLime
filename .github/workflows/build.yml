name: Windows build and tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install integration-test engines
        shell: pwsh
        run: |
          choco install ffmpeg libreoffice-fresh pandoc -y --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Engine installation failed' }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path.Split(';') | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore locked dependencies
        run: dotnet restore HandyLime.slnx --locked-mode --configfile NuGet.Config
      - name: Build
        run: dotnet build HandyLime.slnx -c Release --no-restore -warnaserror
      - name: Unit and real conversion integration tests
        run: dotnet run --project tests/HandyLime.Tests -c Release --no-build -- --require-engines
      - name: Package Windows x64 portable app
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: HandyLime-windows-x64
          path: |
            artifacts/HandyLime-windows-x64.zip
            artifacts/HandyLime-windows-x64.zip.sha256
            artifacts/HandyLime-corresponding-source.zip
            artifacts/HandyLime-corresponding-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HandyLime-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --draft --title "HandyLime $TAG" --generate-notes
